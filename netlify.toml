[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/clovia.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=clovia.apk"
    Cache-Control = "public, max-age=86400"

# API response caching
[[headers]]
  for = "/api/users/*/stats"
  [headers.values]
    Cache-Control = "public, max-age=900" # 15 minutes for seller stats

[[headers]]
  for = "/api/users/*/reviews"
  [headers.values]
    Cache-Control = "public, max-age=600" # 10 minutes for reviews

[[headers]]
  for = "/api/users/*"
  [headers.values]
    Cache-Control = "public, max-age=300" # 5 minutes for user profiles
